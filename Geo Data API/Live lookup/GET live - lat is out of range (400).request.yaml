$kind: http-request
url: "{{baseUrl}}/api/geo-data?lat=95&lon=10"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql('lat must be a number from -90 to 90 (got "95")');
      });
    language: text/javascript
order: 3000
