$kind: http-request
url: "{{baseUrl}}/api/geo-data?limit=1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("limit=1 sent back 1 entry", () => {
          pm.expect(res.data).to.have.lengthOf(1);
          pm.expect(res.count).to.eql(1);
          pm.expect(res.total).to.be.at.least(1);
      });

      pm.test("No sort came before the limit, so the default sort (newest first) went first", () => {
          pm.expect(res.query).to.eql([
              { sort: { observedAt: -1, _id: 1 }, default: true },
              { limit: 1 },
          ]);
      });
    language: text/javascript
order: 4000
