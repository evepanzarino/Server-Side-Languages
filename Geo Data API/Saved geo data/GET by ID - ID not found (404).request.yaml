$kind: http-request
url: "{{baseUrl}}/api/geo-data/{{missingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 404", () => {
          pm.response.to.have.status(404);
      });

      pm.test("Message says the geo data wasn't found", () => {
          pm.expect(res.message).to.eql("Geo data " + pm.collectionVariables.get("missingId") + " not found");
      });
    language: text/javascript
order: 7000
