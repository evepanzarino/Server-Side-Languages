$kind: http-request
url: "{{baseUrl}}/api/geo-data/{{geoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("It's the Orlando entry that was just saved", () => {
          pm.expect(res.message).to.eql("Get geo data by ID");
          pm.expect(res.data._id).to.eql(pm.collectionVariables.get("geoId"));
          pm.expect(res.data.name).to.eql("Orlando");
      });
    language: text/javascript
order: 2000
