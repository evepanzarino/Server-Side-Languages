$kind: http-request
url: "{{baseUrl}}/pallettes/{{palletteId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200 OK", () => {
          pm.response.to.have.status(200);
      });

      pm.test("The valid update is saved in the database", () => {
          pm.expect(res.data.Description).to.eql("Cool ocean colors");
          pm.expect(res.data.NumberofColors).to.eql(3);
      });

      pm.test("The rejected update was not saved", () => {
          pm.expect(res.data.name).to.eql(pm.collectionVariables.get("palletteName"));
          pm.expect(res.data.hexcodes).to.eql(["#00ffff", "#008080", "#000080"]);
      });
    language: text/javascript
order: 4000
