$kind: http-request
url: "{{baseUrl}}/pallettes?sort=-_id"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      // GET all is paged now (10 at a time), so sort=-_id puts the newest
      // pallette first. That way the pallette this run made is on page 1.

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Message is correct", () => {
          pm.expect(res.message).to.eql("Get all pallettes");
      });

      pm.test("List includes the new pallette", () => {
          pm.expect(res.data.map((p) => p._id)).to.include(pm.collectionVariables.get("palletteId"));
      });

      pm.test("select() left __v out of every item", () => {
          res.data.forEach((item) => pm.expect(item).to.not.have.property("__v"));
      });
    language: text/javascript
order: 2000
