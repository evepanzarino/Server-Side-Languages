$kind: http-request
url: "{{baseUrl}}/pallettes/{{missingId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "hexcodes": [
        "#00ffff"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const missingId = pm.collectionVariables.get("missingId");

      pm.test("Status is 404 Not Found", () => {
          pm.response.to.have.status(404);
      });

      pm.test("Message says which pallette wasn't found", () => {
          pm.expect(res.message).to.eql("Pallette " + missingId + " not found");
      });

      pm.test("No pallette is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 3000
