$kind: http-request
url: "{{baseUrl}}/pallettes/{{palletteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "x",
      "hexcodes": [
        "zz"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400 Bad Request", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says validation failed", () => {
          pm.expect(res.message).to.eql("Validation failed");
      });

      pm.test("errors lists the message for each bad field", () => {
          pm.expect(res.errors).to.eql({
              name: "name must be at least 2 characters",
              "hexcodes.0": '"zz" is not a 6-digit hex code',
          });
      });

      pm.test("No pallette is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 2000
