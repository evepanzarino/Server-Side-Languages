$kind: http-request
url: "{{baseUrl}}/pallettes/not-an-id"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400 Bad Request", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says the ID is not valid", () => {
          pm.expect(res.message).to.eql("not-an-id is not a valid ID");
      });

      pm.test("No pallette is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 3000
