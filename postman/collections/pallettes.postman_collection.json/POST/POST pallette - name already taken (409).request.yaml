$kind: http-request
url: "{{baseUrl}}/pallettes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{palletteName}}",
      "Description": "Forest greens",
      "colorTypes": "green",
      "hexcodes": [
        "#228b22"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const name = pm.collectionVariables.get("palletteName");

      pm.test("Status is 409 Conflict", () => {
          pm.response.to.have.status(409);
      });

      pm.test("Message says the name is taken", () => {
          pm.expect(res.message).to.eql('name "' + name + '" is already taken');
      });

      pm.test("No pallette is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 3000
