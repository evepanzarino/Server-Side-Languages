$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Message is Service is up", () => pm.expect(pm.response.json().message).to.eql("Service is up"));
    language: text/javascript
order: 1000
