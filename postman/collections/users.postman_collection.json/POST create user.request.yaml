$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Ada Lovelace",
      "email": "ada@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", () => pm.response.to.have.status(201));
      // Save the new user's ID so the by-ID requests below use it.
      pm.collectionVariables.set("userId", pm.response.json().data.id);
    language: text/javascript
order: 3000
