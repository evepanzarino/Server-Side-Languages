$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&limit=2&sort=-NumberofColors&select=name,NumberofColors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      // Same steps as "sort then limit", in the other order.
      pm.test("Limit first, then sort: the first 2 by name (Monochrome and Ocean), most colors first", () => {
          pm.expect(names).to.eql(["Ocean", "Monochrome"]);
      });

      pm.test("The default sort by name went first, because limit came before any sort", () => {
          pm.expect(res.query[0]).to.include({ default: true });
          pm.expect(res.query[0].sort).to.have.property("name", 1);
      });
    language: text/javascript
order: 8000
