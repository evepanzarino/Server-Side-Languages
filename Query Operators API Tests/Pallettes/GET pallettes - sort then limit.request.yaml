$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&sort=-NumberofColors&limit=2&select=name,NumberofColors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Sort first, then limit: the 2 with the most colors", () => {
          pm.expect(names).to.eql(["Ocean", "Sunset"]);
      });
    language: text/javascript
order: 7000
