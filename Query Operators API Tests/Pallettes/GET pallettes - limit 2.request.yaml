$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&limit=2&select=name"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("limit=2 kept the first 2 pallettes, sorted by name", () => {
          pm.expect(names).to.eql(["Monochrome", "Ocean"]);
      });

      pm.test("count is what came back, total is every pallette the filters match", () => {
          pm.expect(res.count).to.eql(2);
          pm.expect(res.total).to.eql(3);
      });
    language: text/javascript
order: 5000
