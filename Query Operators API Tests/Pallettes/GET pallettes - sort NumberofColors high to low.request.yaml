$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&sort=-NumberofColors&select=name,NumberofColors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Most colors first", () => {
          pm.expect(res.data.map((p) => p.NumberofColors)).to.eql([4, 3, 2]);
          pm.expect(names).to.eql(["Ocean", "Sunset", "Monochrome"]);
      });

      pm.test("The sort step is in the query, after the _id filter", () => {
          pm.expect(res.query[1]).to.eql({ sort: { NumberofColors: -1, _id: 1 } });
      });
    language: text/javascript
order: 4000
