$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&skip=2&limit=2&select=name"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("skip=2 skipped the first 2 pallettes, so only Sunset is left", () => {
          pm.expect(names).to.eql(["Sunset"]);
          pm.expect(res.count).to.eql(1);
          pm.expect(res.total).to.eql(3);
      });
    language: text/javascript
order: 6000
