$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&NumberofColors[ne]=3&select=-hexcodes,-Description"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Every pallette but the one with 3 colors", () => {
          pm.expect(names).to.eql(["Monochrome", "Ocean"]);
      });

      pm.test("select left out hexcodes, Description and __v", () => {
          res.data.forEach((p) => {
              pm.expect(Object.keys(p).sort()).to.eql(["NumberofColors", "_id", "colorTypes", "name"]);
          });
      });
    language: text/javascript
order: 2000
