$kind: http-request
url: "{{baseUrl}}/colors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Black",
      "colorType": [
        "black"
      ],
      "hexcode": "#000000",
      "opacity": 100,
      "pallette": "{{monochromeId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 201", () => {
          pm.response.to.have.status(201);
      });

      pm.test("Color is saved with opacity 100", () => {
          pm.expect(res.data.name).to.eql("Black");
          pm.expect(res.data.opacity).to.eql(100);
      });
    language: text/javascript
order: 5000
