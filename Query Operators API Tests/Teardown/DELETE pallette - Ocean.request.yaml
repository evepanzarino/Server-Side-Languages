$kind: http-request
url: "{{baseUrl}}/pallettes/{{oceanId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("The pallette and its 1 color were deleted", () => {
          pm.expect(res.message).to.eql("Pallette deleted along with 1 color");
          pm.expect(res.id).to.eql(pm.collectionVariables.get("oceanId"));
      });
    language: text/javascript
order: 3000
