$kind: http-request
url: "{{baseUrl}}/colors?pallette[in]={{palletteIds}}&page=4&limit=2"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("There's nothing on page 4", () => {
          pm.expect(res.data).to.eql([]);
          pm.expect(res.count).to.eql(0);
      });

      pm.test("prev links back to the last page, page 3", () => {
          pm.expect(res.pagination.totalPages).to.eql(3);
          pm.expect(res.pagination.prev).to.include("&page=3&limit=2");
          pm.expect(res.pagination.next).to.eql(null);
      });
    language: text/javascript
order: 4000
