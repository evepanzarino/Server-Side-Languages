$kind: http-request
url: "{{baseUrl}}/pallettes?_id[in]={{palletteIds}}&page=2&limit=2&select=name"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((p) => p.name.replace(" " + pm.collectionVariables.get("run"), ""));

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Page 2 is the last pallette, Sunset", () => {
          pm.expect(names).to.eql(["Sunset"]);
          pm.expect(res.count).to.eql(1);
      });

      pm.test("The last page links back to page 1 and has no next", () => {
          pm.expect(res.pagination.page).to.eql(2);
          pm.expect(res.pagination.prev).to.include("&page=1&limit=2&select=name");
          pm.expect(res.pagination.next).to.eql(null);
      });
    language: text/javascript
order: 2000
