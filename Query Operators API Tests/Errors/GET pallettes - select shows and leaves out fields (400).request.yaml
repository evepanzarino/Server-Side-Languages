$kind: http-request
url: "{{baseUrl}}/pallettes?select=name,-hexcodes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql("select can list fields to show, or fields to leave out with a -, but not both");
      });
    language: text/javascript
order: 5000
