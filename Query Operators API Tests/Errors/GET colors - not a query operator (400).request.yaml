$kind: http-request
url: "{{baseUrl}}/colors?opacity[between]=10"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql("between is not a query operator. Use one of: eq, ne, gt, gte, lt, lte, in, nin");
      });
    language: text/javascript
order: 2000
