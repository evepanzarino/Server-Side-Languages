$kind: http-request
url: "{{baseUrl}}/colors?page=0"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql("page must be a whole number, 1 or more");
      });
    language: text/javascript
order: 10000
