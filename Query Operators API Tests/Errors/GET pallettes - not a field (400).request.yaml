$kind: http-request
url: "{{baseUrl}}/pallettes?color=red"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql('"color" is not a field. Use one of: name, Description, colorTypes, hexcodes, NumberofColors, _id');
      });
    language: text/javascript
order: 4000
