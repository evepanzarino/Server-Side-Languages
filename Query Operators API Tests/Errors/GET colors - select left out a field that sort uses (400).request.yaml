$kind: http-request
url: "{{baseUrl}}/colors?select=name&sort=opacity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message says what's wrong", () => {
          pm.expect(res.message).to.eql("sort uses opacity, but a select before it left opacity out");
      });
    language: text/javascript
order: 3000
