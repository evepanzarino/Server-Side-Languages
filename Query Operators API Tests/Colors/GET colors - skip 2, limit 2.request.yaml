$kind: http-request
url: "{{baseUrl}}/colors?pallette[in]={{palletteIds}}&sort=opacity&skip=2&limit=2&select=name,opacity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((c) => c.name);

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("skip=2 skipped the 2 most see-through colors, and limit=2 kept the next 2", () => {
          pm.expect(names).to.eql(["Gold", "Sunset Orange"]);
          pm.expect(res.count).to.eql(2);
          pm.expect(res.total).to.eql(5);
      });
    language: text/javascript
order: 5000
