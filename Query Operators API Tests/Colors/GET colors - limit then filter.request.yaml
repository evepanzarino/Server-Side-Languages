$kind: http-request
url: "{{baseUrl}}/colors?pallette[in]={{palletteIds}}&limit=2&opacity[gt]=50&select=name,opacity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((c) => c.name);

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      // Same steps as "filter then limit", in the other order.
      pm.test("The first 2 colors (White and Black), then only the ones over 50", () => {
          pm.expect(names).to.eql(["Black"]);
      });

      pm.test("total still counts every color the filters match", () => {
          pm.expect(res.count).to.eql(1);
          pm.expect(res.total).to.eql(3);
      });
    language: text/javascript
order: 8000
