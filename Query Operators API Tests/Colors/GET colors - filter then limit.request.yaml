$kind: http-request
url: "{{baseUrl}}/colors?pallette[in]={{palletteIds}}&opacity[gt]=50&limit=2&select=name,opacity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((c) => c.name);

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Filter first (Black, Gold, Sunset Orange), then the first 2 of those", () => {
          pm.expect(names).to.eql(["Black", "Gold"]);
      });
    language: text/javascript
order: 7000
