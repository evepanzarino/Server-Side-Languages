$kind: http-request
url: "{{baseUrl}}/colors?pallette[in]={{palletteIds}}&sort=-opacity&select=name,opacity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const names = res.data.map((c) => c.name);

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Most solid first", () => {
          pm.expect(res.data.map((c) => c.opacity)).to.eql([100, 80, 60, 40, 20]);
          pm.expect(names).to.eql(["Black", "Sunset Orange", "Gold", "Turquoise", "White"]);
      });
    language: text/javascript
order: 4000
