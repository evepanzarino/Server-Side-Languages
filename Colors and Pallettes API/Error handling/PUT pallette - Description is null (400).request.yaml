$kind: http-request
url: "{{baseUrl}}/pallettes/{{palletteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Description": null
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Description is reported", () => {
          pm.expect(res.errors).to.eql({ Description: "Description is required" });
      });
    language: text/javascript
order: 6000
