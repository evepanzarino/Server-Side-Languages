$kind: http-request
url: "{{baseUrl}}/pallettes/not-an-id"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Message is correct", () => {
          pm.expect(res.message).to.eql("not-an-id is not a valid ID");
      });
    language: text/javascript
order: 7000
