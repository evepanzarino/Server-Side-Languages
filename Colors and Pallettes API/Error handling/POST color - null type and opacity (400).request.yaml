$kind: http-request
url: "{{baseUrl}}/colors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Null Green",
      "colorType": [
        "green",
        null
      ],
      "opacity": null,
      "pallette": "{{palletteId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 400", () => {
          pm.response.to.have.status(400);
      });

      pm.test("colorType and opacity are reported", () => {
          pm.expect(res.errors).to.eql({
              colorType: "colorType must list 1 or 2 different types",
              opacity: "opacity must be a number from 0 to 100",
          });
      });
    language: text/javascript
order: 10000
