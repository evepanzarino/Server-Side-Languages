$kind: http-request
url: "{{baseUrl}}/pallettes/{{palletteId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Message is correct", () => {
          pm.expect(res.message).to.eql("Get pallette by ID");
      });

      pm.test("Output shows the ID", () => {
          pm.expect(res.id).to.eql(pm.collectionVariables.get("palletteId"));
      });

      pm.test("Pallette has a color list", () => {
          pm.expect(res.data.color).to.be.an("array");
      });

      pm.test("select() left __v out", () => {
          pm.expect(res.data).to.not.have.property("__v");
      });
    language: text/javascript
order: 3000
