$kind: http-request
url: "{{baseUrl}}/pallettes/{{missingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const id = pm.collectionVariables.get("missingId");

      pm.test("Status is 404", () => {
          pm.response.to.have.status(404);
      });

      pm.test("Message says the Pallette was not found", () => {
          pm.expect(res.message).to.eql("Pallette " + id + " not found");
      });

      pm.test("No Pallette is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 1000
