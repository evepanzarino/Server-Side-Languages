$kind: http-request
url: "{{baseUrl}}/colors/{{secondColorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const id = pm.collectionVariables.get("secondColorId");

      pm.test("Status is 404", () => {
          pm.response.to.have.status(404);
      });

      pm.test("Message says the color was not found", () => {
          pm.expect(res.message).to.eql("Color " + id + " not found");
      });

      pm.test("No color is returned", () => {
          pm.expect(res).to.not.have.property("data");
      });
    language: text/javascript
order: 4000
